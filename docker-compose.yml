version: '3.8'

services:
  go:
    build: .
    ports:
      - "8080:8080"
    container_name: url-shortener-test
    environment:
      - PORT=8080
      - NODE_ID=1
      - LOG_LEVEL=debug
      - DATABASE_TTL=1h
      - CONNECTION_STRING=postgres://postgres:password@db:5432/postgres?sslmode=disable
      - REDIS_ADDRS=cache:6379
    depends_on:
          db:
            condition: service_healthy
          cache:
            condition: service_healthy
          goose:
            condition: service_completed_successfully

  goose:
      image: kukymbr/goose-docker:3.26.0
      environment:
        - GOOSE_DRIVER=postgres
        - GOOSE_DBSTRING=postgres://postgres:password@db:5432/postgres?sslmode=disable
      volumes:
        - ./deploy/app/migrations:/migrations
      depends_on:
        db:
          condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: postgres-test
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  cache:
      image: redis:8-alpine
      container_name: redis-test
      ports:
        - "6379:6379"
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 3s
        timeout: 3s
        retries: 5
