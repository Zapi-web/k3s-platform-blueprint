# =======================
# APP SETTINGS
# =======================

service:
  port: 80

image:
  repository: ghcr.io/zapi-web/k3s-platform-blueprint
  tag: latest
  pullPolicy: IfNotPresent

replicas: 3
logLevel: info
environment: prod
port: 8080
autoMigrate: true

server:
  readTimeout: 5s
  writeTimeout: 10s
  shutdownTimeout: 10s

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 200m
    memory: 128Mi

metrics:
  enabled: true

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  cpuUtilization: 75
  memoryUtilization: 80

# =======================
# TRACER
# =======================

tracer:
  enabled: true
  ratio: 0.1
  addr: otel-collector.monitoring.svc.cluster.local:4317

# =======================
# CACHE
# =======================

cache:
  ttl: 24h
  # External cache
  addrs: ""
  masterName: ""

redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    password: "YourStrongPassword" # CHANGE

  master:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    persistence:
      enabled: true
      size: 8Gi
      storageClass: gp3

  replica:
    replicaCount: 2
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    persistence:
      enabled: true
      size: 8Gi
      storageClass: gp3

  sentinel:
    enabled: true
    masterSet: mymaster
    quorum: 2
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true


# =======================
# DATABASE
# =======================

postgresql:
  enabled: true
  instances: 3
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: 18 # CHANGE
  database: "url_shortener"
  username: "url_shortener_user"
  existingSecret:

  storage:
    size: 20Gi
    storageClass: gp3

  backup:
    enabled: false
    retentionPolicy: 14d
    destinationPath:
    endpointURL:
    walCompression: gzip
    maxParallel: 1
    secretName:

    scheduledBackup:
      enabled: true
      schedule: 0 0 2 * * *
      method: barmanObjectStore
      ownerReference: none
      immediate: false
      suspend: false

  monitoring:
    enabled: true
    customMetrics:
      enabled: true

  topologyKey: topology.kubernetes.io/zone

  resources:
    requests:
      memory: 1Gi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 1000m

  pooler:
    enabled: true
    instances: 2
    poolMode: transaction
    maxClientConn: 1000
    defaultPoolSize: 25
    reservePoolSize: 5
    maxDBConnections: 50

database:
  maxConns: 25
  minConns: 5
  maxConnLifetime: 1h
  maxConnIdletime: 30m
  healthCheckPeriod: 1m
  connectionTimeout: 5s
  ttl: 336h

  # If use another PostgreSQL
  connectionString: ""
